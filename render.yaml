services:
  # RakshaSetu FastAPI Backend Service
  - type: web
    name: rakshasetu-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./tourist_safety.db

  # RakshaSetu Web Command Dashboard
  - type: web
    name: rakshasetu-dashboard
    runtime: static
    plan: free
    region: oregon
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rakshasetu-backend.onrender.com
